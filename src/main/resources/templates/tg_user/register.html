<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    /* Отключаем скролл */
    html, body {
      overflow: hidden;
      margin: 0;
      height: 100%;
    }
    /* Основные стили */
    @import url("https://fonts.cdnfonts.com/css/poppins");
    body {
      font-family: "Poppins", sans-serif;
      background-color: #1b1b1b;
      color: #eef8ce;
      font-size: 14px;
      background-image: url(https://assets.codepen.io/453571/bg.avif),
      repeating-linear-gradient(
              to right,
              transparent 0 500px,
              #73814b33 500px 501px
      );
      background-size: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    * {
      padding: 0;
      margin: 0;
      list-style: none;
      box-sizing: border-box;
    }
    .login-container {
      background-color: rgba(27, 27, 27, 0.8); /* Полупрозрачный фон */
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      width: 400px;
      text-align: center;
      position: absolute; /* Абсолютное позиционирование */
      top: 50%; /* Смещение на 50% сверху */
      left: 50%; /* Смещение на 50% слева */
      transform: translate(-50%, -50%); /* Центрирование */
      z-index: 1000; /* Убедитесь, что контейнер поверх других элементов */
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #d1ff48; /* Цвет заголовка */
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #d1ff48; /* Цвет границы */
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.1); /* Полупрозрачный фон для полей */
      color: #eef8ce; /* Цвет текста */
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #d1ff48; /* Цвет кнопки */
      border: none;
      border-radius: 4px;
      color: #1b1b1b; /* Цвет текста кнопки */
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #b9dd4e; /* Цвет кнопки при наведении */
    }
    p {
      text-align: center;
      margin-top: 15px;

    }
    a {
      color: #b9dd4e; /* Задаем цвет гиперссылки (зеленый) */
      text-decoration: none; /* Убираем подчеркивание */
    }
    a:hover {
      color: #d6e4a7; /* Цвет гиперссылки при наведении */
      text-decoration: underline; /* Подчеркивание при наведении */
    }
    /* Стили для текста "АГРО Hack" */
    .agro-hack {
      position: fixed; /* Фиксированное позиционирование */
      top: 20px; /* Отступ сверху */
      left: 20px; /* Отступ слева */
      z-index: 1000; /* Убедитесь, что надпись поверх других элементов */
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .agro {
      font-family: "Poppins", sans-serif;
      font-size: 3em;
      color: #d1ff48;
      animation: neon-glow 1.5s infinite alternate;
    }
    .hack {
      font-family: "Bebas Neue", sans-serif;
      font-size: 2em; /* Уменьшил размер шрифта для Hack */
      color: #b9dd4e;
    }
    @keyframes neon-glow {
      0% {
        text-shadow: 0 0 5px #d1ff48, 0 0 10px #d1ff48, 0 0 20px #d1ff48, 0 0 40px #d1ff48;
      }
      100% {
        text-shadow: 0 0 10px #d1ff48, 0 0 20px #d1ff48, 0 0 40px #d1ff48, 0 0 80px #d1ff48;
      }
    }
    /* Стили для цветочков и растений */
    .flower {
      position: absolute;
      width: 700px; /* Увеличен размер цветка */
      z-index: 0;
    }
    .plant {
      position: absolute;
      width: 500px;
      z-index: 0;
    }
  </style>
</head>
<body>
<div class="login-container">
  <h2>Регистрация</h2>
  <form id="registerForm">
    <div class="form-group">
      <label for="username">Имя пользователя:</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div class="form-group">
      <label for="password">Пароль:</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="form-group">
      <label for="api_id">API ID:</label>
      <input type="text" id="api_id" name="api_id" required>
    </div>
    <div class="form-group">
      <label for="api_hash">API Hash:</label>
      <input type="text" id="api_hash" name="api_hash" required>
    </div>
    <div class="form-group">
      <label for="telephone">Телефон:</label>
      <input type="text" id="telephone" name="telephone" required>
    </div>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <p>Уже есть аккаунт? <a href="/tg_user/login">Войти</a></p>
</div>
<div class="agro-hack">
  <div class="agro">АГРО</div>
  <div class="hack">Hack</div>
</div>
<img src="https://assets.codepen.io/453571/leaf.png" class="plant" style="bottom: 5%; left: 35%;">
<img src="https://assets.codepen.io/453571/flower.png" class="flower" style="top: 60%; left: 10%;">
<img src="https://assets.codepen.io/453571/flower.png" class="flower" style="top: 50%; right: 15%;">
<img src="https://assets.codepen.io/453571/flower.png" class="flower" style="bottom: -23%; left: 30%;">
<script>
  document.getElementById('registerForm').addEventListener('submit', function (event) {
    event.preventDefault();
    const user = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      api_id: document.getElementById('api_id').value,
      api_hash: document.getElementById('api_hash').value,
      telephone: document.getElementById('telephone').value
    };
    fetch('/tg_user/api/new', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(user)
    })
            .then(response => {
              if (response.ok) {
                alert('Регистрация прошла успешно!');
                window.location.href = '/tg_user/login';
              } else {
                alert('Регистрация не удалась. Пожалуйста, попробуйте снова.');
              }
            })
            .catch(error => {
              console.error('Ошибка:', error);
              alert('Произошла ошибка. Пожалуйста, попробуйте снова.');
            });
  });
</script>
</body>
</html>
